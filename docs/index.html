<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0B0F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Videothek</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Top App Bar -->
    <header class="topbar">
      <div class="brand-group">
        <span class="brand-dot" aria-hidden="true"></span>
        <div>
          <h1 class="brand-title">VIDEOTHEK</h1>
          <p id="catalog-stats" class="brand-subtitle">50 Darstellerinnen • 0 Video-Links</p>
        </div>
      </div>

      <div class="topbar-actions">
        <button id="btn-export" class="icon-btn" type="button" title="Katalog exportieren (JSON)" aria-label="Katalog exportieren">
          <span>Export</span>
        </button>
        <label class="icon-btn file-btn" title="Katalog importieren (JSON)" aria-label="Katalog importieren">
          <span>Import</span>
          <input id="input-import" type="file" accept="application/json" hidden />
        </label>
        <button id="btn-add-performer" class="primary-btn" type="button">+ Neu</button>
      </div>
    </header>

    <!-- Catalog View -->
    <main id="catalog-view" class="catalog-view">
      <section class="controls-bar" aria-label="Suche und Sortierung">
        <div class="search-wrap">
          <input
            id="search-input"
            type="search"
            class="search-input"
            placeholder="Darstellerin suchen…"
            autocomplete="off"
          />
        </div>

        <div class="chips-scroll" role="group" aria-label="Sortierung">
          <button class="chip active" data-sort="alpha_asc" type="button">Alphabet A–Z</button>
          <button class="chip" data-sort="alpha_desc" type="button">Alphabet Z–A</button>
          <button class="chip" data-sort="videos_desc" type="button">Meiste Videos</button>
          <button class="chip" data-sort="videos_asc" type="button">Wenigste Videos</button>
        </div>

        <div class="chips-scroll" role="group" aria-label="Buchstabenfilter">
          <button class="chip active" data-bucket="ALL" type="button">Alle</button>
          <button class="chip" data-bucket="A_E" type="button">A–E</button>
          <button class="chip" data-bucket="F_J" type="button">F–J</button>
          <button class="chip" data-bucket="K_O" type="button">K–O</button>
          <button class="chip" data-bucket="P_T" type="button">P–T</button>
          <button class="chip" data-bucket="U_Z" type="button">U–Z</button>
        </div>
      </section>

      <section id="performer-grid" class="performer-grid" aria-live="polite"></section>

      <section id="empty-state" class="empty-state hidden">
        <h2>Keine Treffer gefunden</h2>
        <p>Filter zurücksetzen oder Suchbegriff anpassen.</p>
        <button id="btn-reset-filters" class="primary-btn" type="button">Filter zurücksetzen</button>
      </section>
    </main>

    <!-- Detail View -->
    <main id="detail-view" class="detail-view hidden">
      <div class="detail-nav">
        <button id="btn-back" class="secondary-btn" type="button">← Zurück</button>
      </div>

      <div class="detail-layout">
        <aside class="detail-portrait-col">
          <div id="detail-portrait-card" class="portrait-card detail-portrait"></div>
          <div class="portrait-actions">
            <label class="secondary-btn file-btn">
              <span>Lokales Bild wählen</span>
              <input id="input-performer-file" type="file" accept="image/*" hidden />
            </label>
            <button id="btn-performer-image-url" class="secondary-btn" type="button">Bild-URL setzen</button>
            <button id="btn-performer-remove-image" class="secondary-btn hidden" type="button">Bild entfernen</button>
          </div>
        </aside>

        <section class="detail-main-col">
          <div class="detail-header">
            <div>
              <h2 id="detail-name" class="detail-title"></h2>
              <div id="detail-pills" class="detail-pills"></div>
            </div>
            <div class="detail-manage-actions">
              <button id="btn-rename-performer" class="secondary-btn" type="button">Umbenennen</button>
              <button id="btn-delete-performer" class="danger-btn" type="button">Löschen</button>
            </div>
          </div>

          <div class="videos-header">
            <h3>Videos</h3>
            <button id="btn-add-video" class="primary-btn" type="button">+ Video-Link</button>
          </div>

          <div id="video-list" class="video-grid"></div>
          <div id="video-empty" class="video-empty hidden">
            Noch keine Video-Links hinterlegt. Tippe auf „+ Video-Link“, um Titel, Video-URL und Thumbnail hinzuzufügen.
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- Modal Overlay -->
  <div id="modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <form id="modal-form" class="modal-card">
      <h3 id="modal-title" class="modal-title"></h3>
      <div id="modal-fields" class="modal-fields"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="secondary-btn" type="button">Abbrechen</button>
        <button id="modal-submit" class="primary-btn" type="submit">Speichern</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="./app.js"></script>
</body>
</html>
